services:
  web:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8086}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./uploads:/var/www/html/uploads
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      CI_ENV: "${CI_ENV:-production}"
      PHP_MEMORY_LIMIT: "${PHP_MEMORY_LIMIT:-256M}"
      PHP_UPLOAD_MAX_FILESIZE: "${PHP_UPLOAD_MAX_FILESIZE:-100M}"
      PHP_POST_MAX_SIZE: "${PHP_POST_MAX_SIZE:-100M}"
    volumes:
      - ./:/var/www/html
      - ./uploads:/var/www/html/uploads
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: "${DB_NAME:-academy_lms}"
      MARIADB_USER: "${DB_USER:-academy}"
      MARIADB_PASSWORD: "${DB_PASS:-academy_password}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASS:-root_password}"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    restart: unless-stopped

volumes:
  db_data:

